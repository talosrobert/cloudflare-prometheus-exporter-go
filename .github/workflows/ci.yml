name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l . | tee /dev/stderr | (! read -r)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go build ./...
      - run: go test ./... -race

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/cloudflare-exporter
      - run: helm template test charts/cloudflare-exporter --set apiToken.existingSecret=dummy > /dev/null
      - run: helm template test charts/cloudflare-exporter --set apiToken.value=dummy --set serviceMonitor.enabled=true > /dev/null
