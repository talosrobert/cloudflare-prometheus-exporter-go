name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check chart appVersion matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app="$(sed -nE 's/^appVersion: *"?([^"]+)"?$/\1/p' charts/cloudflare-exporter/Chart.yaml)"
          if [ "$app" != "$tag" ]; then
            echo "Chart.yaml appVersion is '$app' but tag is '$tag' — run: make bump VERSION=$tag, commit, re-tag" >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
