replicaCount: 1

image:
  repository: ghcr.io/talosrobert/cloudflare-prometheus-exporter-go
  # Defaults to Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  # Defaults to the chart's fullname when empty.
  name: ""
  # This exporter only calls the Cloudflare API, never the Kubernetes API.
  automountServiceAccountToken: false

# CLOUDFLARE_API_TOKEN source. Set exactly one:
# - existingSecret: reference a Secret you created yourself (recommended).
# - value: let the chart create the Secret for you from plaintext (only for
#   quick local testing — never commit a values file with this set).
apiToken:
  existingSecret: ""
  existingSecretKey: CLOUDFLARE_API_TOKEN
  value: ""

# Command-line flags, see the README's flags table.
exporter:
  configPath: /etc/cloudflare-exporter/config.yaml
  analyticsWindow: 1m
  analyticsLag: 5m
  queryLimit: 10000
  metricsPath: /metrics
  # Bounds one whole scrape across every job/account/zone combined. Keep the
  # service annotations and serviceMonitor scrape-timeout/interval below in
  # sync with this value — Prometheus cuts the connection on its own timeout
  # before the exporter finishes otherwise.
  scrapeTimeout: 120s
  # How many accounts within a job are scraped in parallel; all accounts in a
  # job share the scrapeTimeout budget above.
  accountConcurrency: 4
  # Bounds a single HTTP/WAF/Errors analytics API call, independent of
  # scrapeTimeout.
  requestTimeout: 30s
  # Bounds the DNS analytics call, which queries a heavier account-wide dataset
  # than the per-zone calls and so gets a longer budget.
  dnsRequestTimeout: 120s
  # Rendered as-is into config.yaml's discovery.jobs; see the main README for
  # the searchTags/accounts shape.
  discovery:
    jobs:
      - name: production-zones
        searchTags:
          - key: env
            value: production

service:
  type: ClusterIP
  port: 9199
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9199"
    prometheus.io/path: "/metrics"
    # This exporter has no independent poll loop — every scrape queries
    # Cloudflare directly, so the scrape interval is the Cloudflare API call
    # rate. Raise these to reduce Cloudflare API pressure/avoid rate-limiting
    # (matches serviceMonitor.interval/.scrapeTimeout's defaults below).
    prometheus.io/interval: "150s"
    prometheus.io/scrape-timeout: "120s"

# Requires the Prometheus Operator CRDs.
serviceMonitor:
  enabled: false
  interval: 150s
  scrapeTimeout: 120s
  labels: {}
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  # matches USER 10001 in Containerfile.release
  runAsUser: 10001

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
podLabels: {}
