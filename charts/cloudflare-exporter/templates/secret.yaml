{{- /*
Only rendered in "chart-managed secret" mode. With apiToken.existingSecret set
instead, bring your own Secret and this template renders nothing.
*/ -}}
{{- if and (not .Values.apiToken.existingSecret) .Values.apiToken.value }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudflare-exporter.secretName" . }}
  labels:
    {{- include "cloudflare-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiToken.existingSecretKey }}: {{ .Values.apiToken.value | quote }}
{{- end }}
