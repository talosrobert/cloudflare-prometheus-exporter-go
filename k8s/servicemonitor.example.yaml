# Requires the Prometheus Operator CRDs. Not applied by default.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflare-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-exporter
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 30s
