apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-exporter
  labels:
    app.kubernetes.io/name: cloudflare-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflare-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflare-exporter
          # Pin to a released tag or digest before deploying.
          image: cloudflare-prometheus-exporter-go:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -config=/etc/cloudflare-exporter/config.yaml
          ports:
            - name: metrics
              containerPort: 9199
          env:
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-exporter-token
                  key: CLOUDFLARE_API_TOKEN
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflare-exporter
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: cloudflare-exporter-config
