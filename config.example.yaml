# CLOUDFLARE_API_TOKEN must be set in the environment (e.g. from a Kubernetes
# Secret) — it is never read from this file.
discovery:
  jobs:
    # A job with no `accounts` scans every account the API token can see; a
    # job with no `searchTags` scrapes every zone in the selected accounts.
    - name: production-zones
      searchTags:
        - key: env
          value: production
        - key: team
          value: platform

    - name: staging-zones
      accounts:
        - "0123456789abcdef0123456789abcdef"
      searchTags:
        - key: env
          value: staging
      # metricGroups picks which analytics groups to collect for this job's
      # accounts: zone, dns, firewall, errors (exact lowercase names). Omit
      # for all four. A dropped group skips its Cloudflare API call, not just
      # its metrics. When two jobs select the same zone, the first job in
      # this list claims it and its metricGroups win — a later job's
      # differing metricGroups are ignored for that zone.
      metricGroups:
        - dns
        - firewall

server:
  listenAddress: ":9199"
  metricsPath: "/metrics"
  scrapeTimeout: 30s
